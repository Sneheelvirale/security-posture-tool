{% extends "base.html" %}

{% block title %}Add Organisation - SecurePosture{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-semibold">Add New Organisation</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Organisation Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="e.g., Maple Leaf Bakery">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="industry" class="form-label">Industry</label>
                                <select class="form-select" id="industry" name="industry">
                                    <option value="Retail & Commerce">Retail & Commerce</option>
                                    <option value="Healthcare">Healthcare</option>
                                    <option value="Technology & SaaS">Technology & SaaS</option>
                                    <option value="Finance & Accounting">Finance & Accounting</option>
                                    <option value="Manufacturing">Manufacturing</option>
                                    <option value="Professional Services">Professional Services</option>
                                    <option value="Non-Profit">Non-Profit</option>
                                    <option value="Education">Education</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="size" class="form-label">Organisation Size</label>
                                <select class="form-select" id="size" name="size">
                                    <option value="Micro (1-9 employees)">Micro (1-9 employees)</option>
                                    <option value="Small (10-49 employees)" selected>Small (10-49 employees)</option>
                                    <option value="Medium (50-249 employees)">Medium (50-249 employees)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">Description & Context</label>
                            <textarea class="form-control" id="description" name="description" rows="4"
                                placeholder="Describe the organisation's IT environment, key assets, data handled, and current security awareness..."></textarea>
                            <div class="form-text">Include details like cloud vs on-premise, sensitive data stored, remote workers, etc.</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('main.organisations') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Organisation</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
